<body>
<div class="app">
<aside class="sidebar">
  <div class="brand"><div class="mark">🛵</div><div><b>وَصلة برو</b><small>نظام محاسبة كباتن التوصيل</small></div></div>
  <div class="navtitle">القائمة الرئيسية</div><nav class="nav" id="navDesktop"></nav>
  <div class="sidecard"><label>شركة التوصيل / الاتحاد</label><select id="companySelect" aria-label="اختيار الشركة"></select><label>تجربة النظام باسم</label><select id="userSelect" aria-label="اختيار الكابتن"></select><button class="btn outline sm" onclick="ui.openLogin()">🔑 تسجيل كابتن جديد</button></div>

</aside>
<main class="main">

<div class="view" id="view"></div>

<div id="notice" class="notice" role="status"></div><div id="print-sheet"></div>
<script>
(()=>{'use strict';
const KEY='wasla_video_updated_v3', NOW=()=>new Date().toISOString();

const jd=v=>((Number(v)||0)/1000).toFixed(3)+' د.أ';
const arDate=d=>new Date(d).toLocaleString('ar-JO',{dateStyle:'short',timeStyle:'short'});

 chat:[{id:'m1',companyId:'c1',orderId:501,sender:'u3',text:'توصيل من الحصن إلى إربد — أجرة 4 دنانير',type:'post',at:t},{id:'m2',companyId:'c1',orderId:501,sender:'u4',text:'أنا بستلم 🛵',type:'claim',at:t},{id:'m3',companyId:'c1',orderId:501,text:'✅ خالد أكّد ليث بـ «تم». احتُسبت العمولة على الطرفين.',type:'system',at:t},{id:'m4',companyId:'c1',orderId:502,sender:'u1',text:'من الصويفية إلى عبدون — أجرة 5 دنانير. مين فاضي؟',type:'post',at:t},{id:'m5',companyId:'c1',orderId:502,sender:'u2',text:'أنا بستلم 🙋',type:'claim',at:t},{id:'m6',companyId:'c1',orderId:503,sender:'u3',text:'من المفرق إلى إربد — مين قريب؟',type:'post',at:t},{id:'m7',companyId:'c1',orderId:504,sender:'u4',text:'من دوار المدينة إلى الجامعة — أجرة 3.5 دنانير',type:'post',at:t},{id:'m8',companyId:'c2',orderId:505,sender:'u5',text:'من وسط البلد إلى المحطة — أجرة 3 دنانير',type:'post',at:t}]};}
let s;try{s=JSON.parse(localStorage.getItem(KEY)||'null');if(s?.version!==3||!Array.isArray(s.ledger))s=seed()}catch(e){s=seed()}
let closeTimer,modalAction=null;const company=()=>s.companies.find(x=>x.id===s.company),user=(uid)=>s.users.find(x=>x.id===uid),isAdmin=()=>s.viewer==='admin',me=()=>user(s.viewer),name=(uid)=>uid==='admin'?'المشرف':user(uid)?.name||'غير معروف',orders=()=>s.orders.filter(o=>o.companyId===s.company),ledgers=()=>s.ledger.filter(x=>x.companyId===s.company),payRequests=()=>s.payments.filter(x=>x.companyId===s.company),disputes=()=>s.disputes.filter(x=>x.companyId===s.company),activeUsers=()=>s.users.filter(x=>x.companyId===s.company),order=id=>orders().find(x=>x.id===Number(id));

const balance=(uid)=>ledgers().filter(x=>x.userId===uid).reduce((n,x)=>n+(x.kind==='debit'?x.amount:-x.amount),0);
function entriesFor(uid,period='all'){let entries=ledgers().filter(x=>x.userId===uid);const now=Date.now();if(period==='today')entries=entries.filter(x=>new Date(x.at).toDateString()===new Date().toDateString());if(period==='week')entries=entries.filter(x=>new Date(x.at).getTime()>=now-7*864e5);if(period==='month')entries=entries.filter(x=>new Date(x.at).getTime()>=now-30*864e5);return entries.sort((a,b)=>new Date(b.at)-new Date(a.at))}
function dueDate(){let d=new Date();let shift=(4-d.getDay()+7)%7;d.setDate(d.getDate()+shift);d.setHours(22,0,0,0);if(d.getTime()<=Date.now())d.setDate(d.getDate()+7);return d}
function weekId(){let d=new Date();let th=new Date(d);th.setDate(d.getDate()+(4-d.getDay()+7)%7);if(th.getTime()<d.getTime()-2*864e5)th.setDate(th.getDate()+7);return th.toISOString().slice(0,10)}
function tdClass(status){return ({open:'warn',review:'warn',confirmed:'good',cancelled:'bad',pending:'warn',approved:'good',rejected:'bad',resolved:'good'})[status]||'warn'}
function statusName(status){return ({open:'متاح',review:'بحاجة مراجعة',confirmed:'تم التأكيد',cancelled:'ملغي',pending:'بانتظار المراجعة',approved:'موثّق',rejected:'مرفوض',resolved:'تم الحسم'})[status]||status}
function badge(v){return `<span class="pill ${tdClass(v)}">${statusName(v)}</span>`}
function commit(text){event(text);persist();render()}
const tabs=[['chat','💬','المجموعة'],['wallet','👛','محفظتي'],['orders','📦','الطلبات'],['payments','💳','الحوالات'],['subscriptions','🗓','الجرد والاشتراك'],['disputes','🛡️','الاعتراضات'],['leaderboard','🏆','المتصدرون'],['history','📚','السجل'],['settings','⚙️','الإعدادات']];
const onlyAdmin=new Set(['settings']);
function go(p){if(onlyAdmin.has(p)&&!isAdmin())return notify('هذه الصفحة مخصصة للمشرف');if(!tabs.some(t=>t[0]===p))return;s.page=p;persist();render()}
function companySwitch(id){if(!s.companies.some(x=>x.id===id))return;s.company=id;s.viewer=activeUsers().find(x=>x.companyId===id)?.id||'admin';s.page='chat';persist();render();notify('تم التبديل بين الشركات، والحسابات منفصلة')}
function viewerSwitch(id){if(id!=='admin'&&!activeUsers().some(x=>x.id===id))return notify('هذا الكابتن ليس في الشركة الحالية');s.viewer=id;if(id!=='admin'&&onlyAdmin.has(s.page))s.page='chat';persist();render()}
function nav(){let enabled=tabs.filter(x=>isAdmin()||!onlyAdmin.has(x[0]));$('navDesktop').innerHTML=enabled.map(([id,ic,label])=>`<button class="navbutton ${s.page===id?'active':''}" onclick="ui.go('${id}')"><i>${ic}</i>${label}</button>`).join('');$('navMobile').innerHTML=[['chat','💬','المجموعة'],['wallet','👛','المحفظة'],['orders','📦','الطلبات'],['payments','💳','الحوالات'],['more','☰','المزيد']].map(([id,ic,label])=>`<button class="${s.page===id?'active':''}" onclick="${id==='more'?'ui.openMenu()':`ui.go('${id}')`}"><i>${ic}</i>${label}</button>`).join('');$('companySelect').innerHTML=s.companies.map(c=>`<option value="${c.id}" ${s.company===c.id?'selected':''}>${esc(c.name)}</option>`).join('');$('userSelect').innerHTML=[...activeUsers().map(u=>`<option value="${u.id}" ${s.viewer===u.id?'selected':''}>${esc(u.name)} — كابتن</option>`),`<option value="admin" ${isAdmin()?'selected':''}>المشرف — إدارة</option>`].join('');$('who').textContent=isAdmin()?'المشرف':me()?.name||'كابتن';}
function render(){if(!tabs.some(t=>t[0]===s.page)||(!isAdmin()&&onlyAdmin.has(s.page)))s.page='chat';nav();let titles={chat:['مجموعة الكباتن', 'التأكيد بـ «تم» على رد المستلم، وخصم عمولة من الطرفين'],wallet:['المحفظة والجرد', 'قيد لكل عمولة ودفعة مع فلاتر الفترة'],orders:['الطلبات', 'صاحب الطلب هو من يؤكد الكابتن المستلم'],payments:['الحوالات وإثبات الدفع','ارفع إثبات التحويل، ولا تُسدد الذمة قبل موافقة المشرف'],subscriptions:['الاشتراك والجرد الدوري','إعداد وإصدار الجرد يوم الخميس الساعة 10 مساءً'],disputes:['الاعتراضات','اعتراض موثّق ومراجعة المشرف قبل رد العمولة'],leaderboard:['المتصدرون والتقييم','ترتيب الكباتن وفق الطلبات المؤكدة'],history:['سجل العمليات','توثيق الحركات والمحاضر والتسويات'],settings:['إدارة الشركة','عمولة الطرفين، المجموعة، الاشتراك الدوري']};$('pageTitle').textContent=titles[s.page][0];$('pageSub').textContent=`${company().name} • ${titles[s.page][1]}`;let display={chat:renderChat,wallet:renderWallet,orders:renderOrders,payments:renderPayments,subscriptions:renderSubscription,disputes:renderDisputes,leaderboard:renderLeaderboard,history:renderHistory,settings:renderSettings};$('view').innerHTML=display[s.page]();if(s.page==='chat'){let el=$('chatmessages');if(el)el.scrollTop=el.scrollHeight}}
function stat(label,value,ico,caption=''){return `<div class="stat"><span class="icon">${ico}</span><small style="display:block;margin-top:6px">${esc(label)}</small><strong>${esc(value)}</strong><em>${esc(caption)}</em></div>`}
function relevantPayments(){return isAdmin()?payRequests():payRequests().filter(p=>p.uid===s.viewer)}
function renderChat(){let available=orders().filter(o=>o.status==='open');let totalDue=isAdmin()?activeUsers().reduce((a,u)=>a+balance(u.id),0):balance(s.viewer);let msg=s.chat.filter(m=>m.companyId===s.company).slice(-75);return `<div class="chatgrid"><section class="chatbox"><div class="chathead"><div class="person"><span class="avatar">👥</span><div><b>${esc(company().name)} — مجموعة التوصيل</b><small>${activeUsers().length} كباتن • ${available.length} طلب متاح</small></div></div>${isAdmin()?`<button class="btn soft sm" onclick="ui.postForm()">＋ إضافة طلب</button>`:`<button class="btn soft sm" onclick="ui.postForm()">＋ نشر طلب</button>`}</div><div class="chatmessages" id="chatmessages"><div class="systemmsg">هذا محاكي مجموعة واتساب. تتم المحاسبة فقط عند تأكيد صاحب الطلب كابتنًا محددًا، وليس من أي رسالة «تم» عامة.</div>${msg.map(m=>{if(m.type==='system')return `<div class="systemmsg">${esc(m.text)}</div>`;let o=order(m.orderId),mine=m.sender===s.viewer;return `<div class="bubble-wrap ${mine?'mine':''}"><div class="bubble"><b>${esc(name(m.sender))} ${mine?'• أنت':''}</b>${esc(m.text)}${m.type==='post'&&o?`<div class="chips">${badge(o.status)}${o.fare?`<span class="pill">${jd(o.fare)}</span>`:''}</div>${o.status==='open'&&o.owner!==s.viewer&&!isAdmin()?`<div class="chips"><button class="btn soft sm" onclick="ui.claim(${o.id})">🙋 أنا بستلم</button></div>`:''}`:''}${m.type==='claim'&&o&&o.status==='open'&&(isAdmin()||o.owner===s.viewer)?`<div class="chips"><button class="btn success sm" onclick="ui.confirm(${o.id},'${m.sender}')">👍 تم — تأكيد ${esc(name(m.sender))}</button></div>`:''}<small style="display:block;margin-top:5px">${arDate(m.at)}</small></div></div>`}).join('')}</div><div style="padding:0 12px 7px"><div class="chips"><button class="chip" onclick="ui.quick('الطلبات')">الطلبات</button><button class="chip" onclick="ui.quick('حسابي')">حسابي</button><button class="chip" onclick="ui.quick('الجرد')">الجرد</button><button class="chip" onclick="ui.quick('اعتراض')">اعتراض</button></div></div><div class="chatinput"><input id="messageInput" placeholder="اكتب: الطلبات، أنا 502، تم 502، حسابي..." onkeydown="if(event.key==='Enter')ui.send()"/><button class="btn primary" onclick="ui.send()">إرسال</button></div></section><aside class="chat-aside"><div class="panel"><h2>ملخص الحساب</h2>${stat('رصيد العمولة المستحق',jd(totalDue),'👛')}${isAdmin()?'<p class="tiny muted">إجمالي ذمم كباتن الشركة</p>':`<p class="tiny muted">${esc(me()?.name||'')}</p>`}<div class="toolbar"><button class="btn soft sm" onclick="ui.go('wallet')">فتح المحفظة</button><button class="btn plain sm" onclick="ui.go('payments')">سداد</button></div></div><div class="panel"><h2>الجرد القادم</h2><b>${arDate(dueDate())}</b><p class="tiny muted">إصدار الخميس 10 مساءً — تشغيل الإصدار داخل النموذج يدوي من المشرف.</p><button class="btn outline sm" onclick="ui.go('subscriptions')">تفاصيل الجرد</button></div><div class="panel"><h2>واتساب</h2><p class="tiny muted">مشاركة رابط المجموعة إذا أضافه المشرف؛ بدون سحب رسائل واتساب الحقيقي.</p><div class="toolbar"><button class="btn success sm" onclick="ui.openGroup()">فتح المجموعة</button><button class="btn outline sm" onclick="ui.shareGroup()">مشاركة</button></div></div></aside></div>`}
function orderActions(o){let a=[];if(o.status==='open'&&!isAdmin()&&o.owner!==s.viewer&&!o.claims.includes(s.viewer))a.push(`<button class="btn soft sm" onclick="ui.claim(${o.id})">أنا بستلم</button>`);if(o.status==='open'&&(isAdmin()||o.owner===s.viewer))o.claims.forEach(uid=>a.push(`<button class="btn success sm" onclick="ui.confirm(${o.id},'${uid}')">👍 تم — ${esc(name(uid))}</button>`));if(o.status==='review'&&isAdmin())a.push(`<button class="btn soft sm" onclick="ui.setFare(${o.id})">تحديد الأجرة</button>`);if(o.status!=='cancelled'&&o.status!=='review'&&(isAdmin()||o.owner===s.viewer))a.push(`<button class="btn danger sm" onclick="ui.cancel(${o.id})">إلغاء</button>`);if(o.status==='confirmed'&&!isAdmin()&&[o.owner,o.receiver].includes(s.viewer))a.push(`<button class="btn plain sm" onclick="ui.disputeForm(${o.id})">اعتراض</button>`);return a.join('')}
function renderOrders(){let list=orders().slice().sort((a,b)=>b.id-a.id);return `<div class="hero"><div><b>كل الطلبات من مكان واحد</b><p>صاحب الطلب ينشر، كابتن آخر يرد «أنا»، ثم يُؤكّد صاحب الطلب «تم». لا خصم عند الرد وحده.</p><button class="btn primary" onclick="ui.postForm()">＋ نشر طلب جديد</button></div><div class="symbol">📦</div></div><div class="grid cols3" style="margin-bottom:16px">${stat('طلبات متاحة',list.filter(x=>x.status==='open').length,'🆕')}${stat('طلبات مؤكدة',list.filter(x=>x.status==='confirmed').length,'✅')}${stat('تحت مراجعة',list.filter(x=>x.status==='review').length,'🔎')}</div><div class="panel"><div class="panelhead"><h2>سجل الطلبات والتأكيدات</h2><button class="btn outline sm" onclick="ui.exportCSV('orders')">⬇ CSV</button></div><div class="data-list">${list.map(o=>`<div class="item"><div class="itemtop"><b>طلب #${o.id}</b>${badge(o.status)}</div><p>${esc(o.description)}</p><div class="meta"><span>📣 جالب: ${esc(name(o.owner))}</span><span>🛵 مستلم: ${esc(o.receiver?name(o.receiver):'لم يُحدد')}</span><span>💵 ${o.fare?jd(o.fare):'الأجرة غير محددة'}</span><span>📅 ${arDate(o.at)}</span></div>${o.status==='confirmed'?`<p style="color:#8bdcbf;font-size:11px">عمولة الجالب ${jd(Math.round(o.fare*(o.ownerRate??company().ownerRate)/100))} + عمولة المستلم ${jd(Math.round(o.fare*(o.receiverRate??company().receiverRate)/100))}</p>`:''}<div class="toolbar">${orderActions(o)}</div></div>`).join('')||'<div class="empty">لا توجد طلبات لهذه الشركة</div>'}</div></div>`}
function walletUsers(){return isAdmin()?activeUsers():[me()].filter(Boolean)}
function renderWallet(){let u=walletUsers(),dues=u.reduce((a,b)=>a+balance(b.id),0),weekCharge=ledgers().filter(e=>e.kind==='debit'&&Date.now()-new Date(e.at)<7*864e5&&u.some(x=>x.id===e.userId)).reduce((a,x)=>a+x.amount,0),confirmed=orders().filter(o=>o.status==='confirmed'&&(isAdmin()||[o.owner,o.receiver].includes(s.viewer))).length;return `<div class="hero"><div><b>👛 المحفظة • الجرد من غير لخبطة</b><p>الرسوم، والقيود المعكوسة، والسداد الموثّق منفصلة. لا يختفي أي قيد قديم عند الإلغاء.</p></div><div class="symbol">💰</div></div><div class="grid cols4" style="margin-bottom:17px">${stat('الرصيد المستحق',jd(dues),'👛')}${stat('رسوم آخر 7 أيام',jd(weekCharge),'🧾')}${stat('الطلبات المؤكدة',confirmed,'✅')}${stat('حوالات تنتظر الاعتماد',relevantPayments().filter(p=>p.status==='pending').length,'⌛')}</div>${isAdmin()?`<div class="panel"><div class="panelhead"><h2>أرصدة الكباتن</h2><button class="btn outline sm" onclick="ui.exportCSV('balances')">⬇ تصدير الجرد</button></div><div class="tablewrap"><table class="table"><thead><tr><th>الكابتن</th><th>إجمالي الرسوم</th><th>تسويات وخصومات عكس</th><th>المستحق</th><th>الإجراء</th></tr></thead><tbody>${activeUsers().map(u=>{let e=ledgers().filter(x=>x.userId===u.id);return `<tr><td>${esc(u.name)}</td><td>${jd(e.filter(x=>x.kind==='debit').reduce((a,x)=>a+x.amount,0))}</td><td>${jd(e.filter(x=>x.kind==='credit').reduce((a,x)=>a+x.amount,0))}</td><td><b>${jd(balance(u.id))}</b></td><td><button class="btn sm soft" onclick="ui.focusWallet('${u.id}')">التفاصيل</button></td></tr>`}).join('')}</tbody></table></div></div>`:''}<div class="panel"><div class="panelhead"><div><h2>تفاصيل القيود المالية</h2><div class="tiny muted">${isAdmin()?'جميع أعضاء الشركة':'حساب الكابتن الحالي'} • حدّد الفترة</div></div><div class="period">${[['today','اليوم'],['week','7 أيام'],['month','30 يومًا'],['all','الكل']].map(([k,v])=>`<button class="btn sm plain ${s.period===k?'active':''}" onclick="ui.setPeriod('${k}')">${v}</button>`).join('')}</div></div><div class="tablewrap"><table class="table"><thead><tr><th>التاريخ</th><th>الكابتن</th><th>البيان</th><th>مدين</th><th>دائن / سداد</th></tr></thead><tbody>${ledgers().filter(x=>(isAdmin()||x.userId===s.viewer)&&(s.period==='all'||(s.period==='today'?new Date(x.at).toDateString()===new Date().toDateString():new Date(x.at).getTime()>=Date.now()-(s.period==='week'?7:30)*864e5))).slice().reverse().map(x=>`<tr><td>${arDate(x.at)}</td><td>${esc(name(x.userId))}</td><td>${esc(x.description)}</td><td style="color:#ffada8">${x.kind==='debit'?jd(x.amount):'—'}</td><td style="color:#61dfb8">${x.kind==='credit'?jd(x.amount):'—'}</td></tr>`).join('')||'<tr><td colspan="5">لا توجد حركات في هذه الفترة</td></tr>'}</tbody></table></div></div>`}
function renderPayments(){let list=relevantPayments().slice().reverse();return `<div class="hero"><div><b>💳 الحوالات وإثبات الدفع</b><p>رفع صورة الحوالة وإدخال المرجع، ثم ينتظر الطلب مراجعة المشرف. لا يتم تخفيض الرصيد قبل الاعتماد.</p><button class="btn primary" onclick="ui.payForm()">＋ رفع إثبات حوالة</button></div><div class="symbol">🧾</div></div><div class="grid cols3" style="margin-bottom:16px">${stat('قيد المراجعة',list.filter(p=>p.status==='pending').length,'⌛')}${stat('حوالات موثقة',list.filter(p=>p.status==='approved').length,'✅')}${stat('حوالات مرفوضة',list.filter(p=>p.status==='rejected').length,'⛔')}</div><div class="panel"><div class="panelhead"><h2>قائمة الحوالات</h2><button class="btn outline sm" onclick="ui.exportCSV('payments')">⬇ CSV</button></div><div class="data-list">${list.map(p=>`<div class="item"><div class="itemtop"><b>حوالة #${p.id} • ${esc(name(p.uid))}</b>${badge(p.status)}</div><p>المبلغ: <b>${jd(p.amount)}</b> • المرجع: ${esc(p.reference)}</p><div class="meta"><span>تاريخ الطلب ${arDate(p.at)}</span>${p.reviewedAt?`<span>تاريخ الاعتماد ${arDate(p.reviewedAt)}</span>`:''}</div><div class="toolbar">${p.proof?`<button class="btn soft sm" onclick="ui.proof(${p.id})">🖼️ صورة الحوالة</button>`:''}${isAdmin()&&p.status==='pending'?`<button class="btn success sm" onclick="ui.approvePayment(${p.id})">✓ اعتماد</button><button class="btn danger sm" onclick="ui.rejectPayment(${p.id})">✕ رفض</button>`:''}${p.status==='approved'?`<button class="btn plain sm" onclick="ui.receipt(${p.id})">🧾 وصل توثيق</button>`:''}</div></div>`).join('')||'<div class="empty">لا توجد حوالات بعد. يمكنك إضافة حوالة تجريبية.</div>'}</div></div>`}
function renderSubscription(){let u=walletUsers(),ch=company().weeklyFee;let active=ledgers().filter(x=>x.category==='subscription');return `<div class="hero"><div><b>🗓 الجرد الأسبوعي والاشتراك</b><p>وفق الفيديو: الخميس الساعة 10 مساءً موعد الجرد. قيمة اشتراك المجموعة اختيارية، ومنفصلة تمامًا عن رسوم الطلبات.</p></div><div class="symbol">⏰</div></div><div class="grid cols3" style="margin-bottom:17px">${stat('موعد الإصدار القادم',dueDate().toLocaleDateString('ar-JO'),'📅','الخميس الساعة 10 مساءً')}${stat('قيمة الاشتراك الاختياري',jd(ch),'💵',ch?'مفعّل':'غير مفعّل افتراضيًا')}${stat('إصدارات الاشتراك المسجلة',active.length,'🧾')}</div><div class="panel"><h2>بيان الاشتراك والجرد</h2><div class="infobox">الاشتراك إن فُعّل يضيف قيدًا مستقلًا على الكابتن مرة واحدة فقط للأسبوع المحدد. لا يخصم رصيد فعلي من البنك أو واتساب، ولا يعمل إصدار تلقائي عندما يكون الملف مغلقًا.</div><div class="toolbar" style="margin-top:14px">${isAdmin()?`<button class="btn primary" onclick="ui.issueSubscription()">إصدار رسوم اشتراك هذا الأسبوع</button><button class="btn outline" onclick="ui.go('settings')">ضبط القيمة</button>`:''}<button class="btn soft" onclick="ui.exportCSV('weekly')">⬇ تنزيل الجرد الأسبوعي CSV</button></div></div><div class="panel"><h2>الرسوم المسجلة</h2><div class="data-list">${active.filter(x=>isAdmin()||x.userId===s.viewer).slice().reverse().map(x=>`<div class="item"><div class="itemtop"><b>${esc(name(x.userId))} • ${jd(x.amount)}</b><span class="pill">قيد اشتراك</span></div><p>${esc(x.description)}</p><small class="muted">${arDate(x.at)}</small></div>`).join('')||'<div class="empty">لا توجد رسوم اشتراكات مسجلة. الإعداد الافتراضي صفر.</div>'}</div></div>`}
function renderDisputes(){let list=disputes().filter(d=>isAdmin()||d.uid===s.viewer).slice().reverse();return `<div class="hero"><div><b>🛡️ حق الكابتن محفوظ بالاعتراض</b><p>الاعتراض يظل معلقًا لحين مراجعته. قبول الاعتراض يعكس رسم الكابتن صاحب الاعتراض مرة واحدة فقط، دون حذف سجل العملية.</p><button class="btn primary" onclick="ui.disputeForm()">＋ تقديم اعتراض</button></div><div class="symbol">🛡️</div></div><div class="panel"><h2>الاعتراضات</h2><div class="data-list">${list.map(d=>`<div class="item"><div class="itemtop"><b>اعتراض #${d.id} — طلب #${d.orderId}</b>${badge(d.status)}</div><p>${esc(d.reason)}</p><div class="meta"><span>${esc(name(d.uid))}</span><span>${arDate(d.at)}</span>${d.resolution?`<span>قرار: ${esc(d.resolution)}</span>`:''}</div>${isAdmin()&&d.status==='open'?`<div class="toolbar"><button class="btn success sm" onclick="ui.resolve(${d.id},true)">قبول ورد العمولة</button><button class="btn danger sm" onclick="ui.resolve(${d.id},false)">رفض مع التوثيق</button></div>`:''}</div>`).join('')||'<div class="empty">لا توجد اعتراضات لهذه الشركة</div>'}</div></div>`}
function renderLeaderboard(){let participants=activeUsers().map(u=>{let accepted=orders().filter(o=>o.status==='confirmed'&&o.receiver===u.id).length,posted=orders().filter(o=>o.status==='confirmed'&&o.owner===u.id).length,dis=disputes().filter(d=>d.uid===u.id&&d.status==='open').length;return {...u,accepted,posted,score:accepted*10+posted*4,dis}}).sort((a,b)=>b.score-a.score);let top=participants[0]?.score||1;return `<div class="hero"><div><b>🏆 المنافسات والمكافآت</b><p>ترتيب توضيحي يعتمد على الطلبات المؤكدة فقط: 10 نقاط للاستلام + 4 نقاط لجلب طلب تم تأكيده. لا يوجد تقييم نجوم حقيقي في هذه النسخة.</p></div><div class="symbol">🏅</div></div><div class="panel"><h2>ترتيب الكباتن</h2>${participants.map((u,i)=>`<div class="rank"><span class="medal">${['🥇','🥈','🥉'][i]||'🛵'}</span><div style="flex:1"><b>${esc(u.name)}</b><div class="tiny muted">استلم ${u.accepted} • جلب ${u.posted} • اعتراضات معلقة ${u.dis}</div><div class="progress"><span style="width:${Math.max(2,u.score/top*100)}%"></span></div></div><span class="score">${u.score} نقطة</span></div>`).join('')}</div>`}
function renderHistory(){if(!isAdmin()){let own=ledgers().filter(e=>e.userId===s.viewer).slice().reverse();return `<div class="panel"><h2>📚 سجل حسابي الشخصي</h2><div class="timeline">${own.map(e=>`<div class="step"><b>${esc(e.description)} — ${jd(e.amount)} (${e.kind==='debit'?'مدين':'دائن'})</b><small>${arDate(e.at)}</small></div>`).join('')||'<div class="empty">لا توجد حركات</div>'}</div></div>`}let rec=s.events.filter(e=>e.companyId===s.company).slice(0,75);return `<div class="panel"><div class="panelhead"><div><h2>📚 سجل التدقيق والعمليات</h2><p class="tiny muted">الاعتراضات والإلغاء والعمولات والحوالات موثقة داخل هذه النسخة التجريبية.</p></div><button class="btn outline sm" onclick="ui.exportCSV('history')">⬇ CSV</button></div><div class="timeline">${rec.map(x=>`<div class="step"><b>${esc(x.text)}</b><small>${arDate(x.at)}</small></div>`).join('')||'<div class="empty">لا توجد حركات</div>'}</div></div>`}
function renderSettings(){return `<div class="panel" style="max-width:850px"><h2>⚙️ سياسة المحاسبة</h2><div class="alert">هذه الإعدادات للمشرف. أي نسب جديدة تطبق على الطلبات التي تُؤكّد بعدها فقط. القيود القديمة لا تتغير.</div><div class="fields"><div class="field"><label>عمولة جالب الطلب (%)</label><input id="rateOwner" type="number" min="0" max="100" step=".5" value="${company().ownerRate}"/></div><div class="field"><label>عمولة المستلم (%)</label><input id="rateReceiver" type="number" min="0" max="100" step=".5" value="${company().receiverRate}"/></div><div class="field"><label>رسوم الاشتراك الأسبوعي الاختياري (دينار)</label><input id="weeklyFee" type="number" min="0" max="100" step=".25" value="${company().weeklyFee/1000}"/><span class="help">0 = الاشتراك غير مفعل. لا يُؤخذ تلقائيًا</span></div><div class="field"><label>كود الشركة التجريبي</label><input value="${esc(company().code)}" disabled/></div><div class="field wide"><label>رابط مجموعة واتساب الرسمي (اختياري)</label><input id="groupLink" type="url" placeholder="https://chat.whatsapp.com/..." value="${esc(company().groupLink)}"/></div></div><div class="toolbar" style="margin-top:16px"><button class="btn primary" onclick="ui.saveSettings()">حفظ الإعدادات</button><button class="btn danger" onclick="ui.reset()">إعادة بيانات العرض</button></div></div><div class="panel" style="max-width:850px"><h2>🏢 إدارة الشركات</h2><div class="infobox">بيانات الشركة الأولى والثانية منفصلة في جميع الطلبات والأرصدة والحوالات. إضافة شركة هنا تجربة محلية فقط.</div><div class="toolbar" style="margin-top:14px"><button class="btn soft" onclick="ui.addCompany()">＋ إضافة شركة جديدة</button></div></div>`}
function modal(title,body,primary,fn){$('modalTitle').textContent=title;$('modalBody').innerHTML=body;$('modalActions').innerHTML=`<button class="btn primary" id="modalConfirm">${esc(primary)}</button><button class="btn plain" onclick="ui.closeModal()">إلغاء</button>`;modalAction=fn;$('modalConfirm').onclick=()=>modalAction&&modalAction();$('modalShade').classList.add('show')}
function closeModal(){$('modalShade').classList.remove('show');modalAction=null}
function postForm(){modal('نشر طلب جديد',`<div class="fields">${isAdmin()?`<div class="field wide"><label>جالب الطلب</label><select id="postOwner">${activeUsers().map(u=>`<option value="${u.id}">${esc(u.name)}</option>`).join('')}</select></div>`:''}<div class="field wide"><label>تفاصيل الطلب والموقع</label><textarea id="newText" placeholder="مثال: من المفرق إلى إربد، التوصيل ..."></textarea></div><div class="field wide"><label>أجرة التوصيل بالدينار (يمكن تركها فارغة للمراجعة)</label><input id="newFare" type="number" min="0.1" step=".25" placeholder="5.00" /></div></div>`,'نشر الطلب',()=>{let txt=$('newText').value.trim(),raw=$('newFare').value,amt=raw===''?null:Math.round(Number(raw)*1000);if(txt.length<8||amt!==null&&(!Number.isFinite(amt)||amt<100||amt>500000)){notify('أدخل وصفًا واضحًا وأجرة صحيحة، أو اترك الأجرة فارغة للمراجعة');return}let owner=isAdmin()?$('postOwner')?.value:s.viewer;if(!owner||!user(owner)||user(owner).companyId!==s.company)return notify('اختر جالب الطلب من نفس الشركة');let id=s.nextOrder++;let o={id,companyId:s.company,owner,receiver:null,fare:amt,description:txt,status:amt?'open':'review',claims:[],at:NOW()};s.orders.push(o);message(txt,'post',id,owner);closeModal();commit(`${name(s.viewer)} نشر الطلب #${id} باسم ${name(owner)}`)})}
function claim(id){let o=order(id);if(!o||o.status!=='open')return notify('الطلب غير متاح');if(isAdmin()||o.owner===s.viewer)return notify('لا يستطيع المشرف أو جالب الطلب استلام طلبه');if(o.claims.includes(s.viewer))return notify('سبق أن طلبت استلام هذا الطلب');o.claims.push(s.viewer);message('أنا بستلم 🙋','claim',id,s.viewer);commit(`${name(s.viewer)} طلب استلام #${id}`)}
function confirm(id,uid){let o=order(id);if(!o||o.status!=='open')return notify('الطلب مؤكد أو لم يعد متاحًا');if(!isAdmin()&&o.owner!==s.viewer)return notify('فقط صاحب الطلب أو المشرف يستطيع التأكيد');if(uid===o.owner||!o.claims.includes(uid)||!user(uid)||user(uid).companyId!==s.company)return notify('يجب اختيار مستلم ردّ على الطلب من نفس المجموعة');if(!Number.isSafeInteger(o.fare)||o.fare<=0)return notify('حدد أجرة الطلب أولًا');if(s.ledger.some(x=>x.orderId===id&&x.kind==='debit'))return notify('العمولة مسجلة سابقًا');let own=Math.round(o.fare*company().ownerRate/100),receive=Math.round(o.fare*company().receiverRate/100);o.status='confirmed';o.receiver=uid;o.confirmedAt=NOW();o.ownerRate=company().ownerRate;o.receiverRate=company().receiverRate;for(let [userId,amount,description] of [[o.owner,own,'جالب'],[uid,receive,'مستلم']])s.ledger.push({id:`charge:${id}:${userId}`,companyId:s.company,userId,kind:'debit',category:'order',orderId:id,amount,description:`عمولة ${description} الطلب #${id}`,at:NOW()});message(`✅ تم تأكيد ${name(uid)} للطلب #${id}. العمولة: ${jd(own)} على ${name(o.owner)} + ${jd(receive)} على ${name(uid)}.`, 'system',id);commit(`${name(s.viewer)} أكّد الطلب #${id} للمستلم ${name(uid)} — قيدان مستقلان`)}
function cancel(id){let o=order(id);if(!o||o.status==='cancelled')return notify('هذا الطلب ملغي بالفعل');if(!isAdmin()&&s.viewer!==o.owner)return notify('الإلغاء من جالب الطلب أو المشرف فقط');let ok=window.confirm(`إلغاء الطلب #${id}؟ سيتم عكس عمولتي الطرفين إن احتُسبتا.`);if(!ok)return;let charges=ledgers().filter(x=>x.category==='order'&&x.orderId===o.id&&x.kind==='debit');for(let x of charges){let reversal='reversal:'+x.id;let netRefunded=ledgers().filter(e=>e.orderId===id&&e.userId===x.userId&&e.kind==='credit'&&['reversal','dispute'].includes(e.category)).reduce((a,e)=>a+e.amount,0);let amount=Math.max(0,x.amount-netRefunded);if(amount&&!s.ledger.some(e=>e.id===reversal))s.ledger.push({id:reversal,companyId:s.company,userId:x.userId,kind:'credit',category:'reversal',orderId:id,amount,description:'عكس صافي '+x.description,at:NOW()})}o.status='cancelled';message(`❌ إلغاء الطلب #${id}${charges.length?' مع عكس رسوم الطرفين.':' بدون رسوم.'}`,'system',id);commit(`إلغاء الطلب #${id} وعكس ${charges.length} رسوم`)}
function setFare(id){let o=order(id);if(!isAdmin()||o?.status!=='review')return notify('لا توجد صلاحية أو لا تحتاج مراجعة');modal('تحديد أجرة الطلب',`<div class="field"><label>الأجرة بالدينار</label><input id="fareReview" type="number" min=".1" max="500" step=".25"/></div>`,'اعتماد الأجرة',()=>{let a=Math.round(Number($('fareReview').value)*1000);if(!Number.isFinite(a)||a<100)return notify('الأجرة غير صحيحة');o.fare=a;o.status='open';closeModal();commit(`المشرف حدّد أجرة #${id}: ${jd(a)}`)})}
function setPeriod(p){s.period=p;persist();render()}
function readFile(file,cb){if(!file||!['image/jpeg','image/png','image/webp'].includes(file.type))return notify('ارفع صورة للحوالة JPG أو PNG أو WebP فقط');if(file.size>2*1024*1024)return notify('حجم الصورة يجب ألا يتجاوز 2 ميغابايت');let reader=new FileReader();reader.onload=()=>{let img=new Image();img.onload=()=>{let can=document.createElement('canvas');let scale=Math.min(1,850/Math.max(img.width,img.height));can.width=Math.round(img.width*scale);can.height=Math.round(img.height*scale);can.getContext('2d').drawImage(img,0,0,can.width,can.height);cb(can.toDataURL('image/jpeg',.65))};img.onerror=()=>notify('تعذر قراءة الصورة');img.src=reader.result};reader.onerror=()=>notify('تعذرت قراءة الصورة');reader.readAsDataURL(file)}
function payForm(){let uid=isAdmin()?activeUsers()[0]?.id:s.viewer;if(!uid)return notify('لا يوجد كباتن');let options=isAdmin()?`<div class="field"><label>الكابتن</label><select id="payUid">${activeUsers().filter(x=>balance(x.id)>0).map(u=>`<option value="${u.id}">${esc(u.name)} (${jd(balance(u.id))})</option>`).join('')}</select></div>`:'';modal('رفع إثبات حوالة',`<div class="fields">${options}<div class="field"><label>المبلغ بالدينار</label><input id="payAmount" type="number" step=".001" min=".001" placeholder="1.000" /></div><div class="field"><label>رقم مرجع الحوالة</label><input id="payRef" placeholder="مثال: TRX-2026-123"/></div><div class="field wide"><label>صورة الحوالة (إلزامية في النموذج)</label><input id="payPhoto" type="file" accept="image/png,image/jpeg,image/webp"/><span class="help">الصورة تحفظ محليًا؛ لا تُرسل لأي بنك.</span></div></div>`,'إرسال للمراجعة',()=>{let uid=isAdmin()?$('payUid')?.value:s.viewer;let amount=Math.round(Number($('payAmount').value)*1000),ref=$('payRef').value.trim(),photo=$('payPhoto').files[0];if(!Number.isSafeInteger(amount)||amount<=0||amount>balance(uid))return notify('المبلغ غير صحيح أو أكبر من المستحق');if(ref.length<5||ref.length>60)return notify('رقم مرجع الحوالة مطلوب (5 حروف على الأقل)');if(payRequests().some(p=>p.reference===ref&&p.uid===uid&&p.status!=='rejected'))return notify('هذا المرجع استُخدم سابقًا');if(!photo)return notify('اختر صورة الحوالة');readFile(photo,(proof)=>{let id=s.nextPayment++;s.payments.push({id,uid,companyId:s.company,amount,reference:ref,proof,status:'pending',at:NOW()});closeModal();commit(`${name(uid)} رفع إثبات حوالة #${id} بقيمة ${jd(amount)}؛ قيد المراجعة`);notify('وصل الإثبات للمراجعة. لم يتم خصم المبلغ حتى يعتمد المشرف.')})})}
function approvePayment(id){if(!isAdmin())return notify('فقط المشرف يعتمد الحوالات');let p=payRequests().find(p=>p.id===Number(id));if(!p||p.status!=='pending')return notify('تمت معالجة الحوالة من قبل');if(p.amount>balance(p.uid))return notify('المبلغ يتجاوز المستحق الحالي؛ ارفض الطلب واطلب تصحيحًا');if(s.ledger.some(x=>x.id==='pay:'+p.id))return notify('قيد السداد موجود سابقًا');p.status='approved';p.reviewedAt=NOW();s.ledger.push({id:'pay:'+p.id,companyId:s.company,userId:p.uid,kind:'credit',category:'payment',orderId:null,amount:p.amount,description:`تسوية حوالة معتمدة #${p.id} (${p.reference})`,at:p.reviewedAt});commit(`المشرف اعتمد حوالة #${p.id} للكابتن ${name(p.uid)} بقيمة ${jd(p.amount)}`)}
function rejectPayment(id){if(!isAdmin())return notify('فقط المشرف يرفض الحوالات');let p=payRequests().find(p=>p.id===Number(id));if(!p||p.status!=='pending')return notify('الحوالة غير معلقة');let r=window.prompt('سبب الرفض (اختياري)', 'الإثبات غير واضح أو لم يصل المبلغ');if(r===null)return;p.status='rejected';p.reviewedAt=NOW();p.reason=r.slice(0,200);commit(`المشرف رفض حوالة #${p.id}: ${p.reason}`)}
function proof(id){let p=payRequests().find(x=>x.id===id);if(!p||(!isAdmin()&&p.uid!==s.viewer))return;modal('صورة الحوالة #'+id,`<img alt="إثبات الحوالة" style="max-width:100%;max-height:65dvh;object-fit:contain;border-radius:10px" src="${p.proof}"/>`,'إغلاق',closeModal)}
function receipt(id){let p=payRequests().find(x=>x.id===id);if(p?.status!=='approved'||(!isAdmin()&&p.uid!==s.viewer))return notify('الوصل متاح فقط للحوالات المعتمدة');let body=`<div class="receipt"><h2 style="margin:0;text-align:center">وصل توثيق سداد — وصلة برو</h2><p style="text-align:center">للاستخدام التجريبي فقط • ليس إيصالًا مصرفيًا</p>${[['الشركة',company().name],['الكابتن',name(p.uid)],['رقم الحوالة','#'+p.id],['المبلغ',jd(p.amount)],['المرجع',p.reference],['تاريخ التوثيق',arDate(p.reviewedAt)]].map(([a,b])=>`<div class="receiptrow"><b>${esc(a)}</b><span>${esc(b)}</span></div>`).join('')}<p style="text-align:center;color:#27674c">✓ تم تسجيل السداد في كشف الحساب</p></div>`;modal('وصل التوثيق',body,'طباعة الوصل',()=>{let sheet=$('print-sheet');sheet.innerHTML=body;window.print()})}
function issueSubscription(){if(!isAdmin())return notify('المشرف فقط');let fee=company().weeklyFee;if(fee<=0)return notify('الاشتراك غير مفعل. غيّر قيمته من الإعدادات أولًا');let key=weekId(),count=0;for(let u of activeUsers()){let id=`sub:${s.company}:${key}:${u.id}`;if(s.ledger.some(x=>x.id===id))continue;s.ledger.push({id,userId:u.id,companyId:s.company,kind:'debit',category:'subscription',orderId:null,amount:fee,description:`اشتراك المجموعة للأسبوع المنتهي ${key}`,at:NOW()});count++}if(!count)return notify('تم إصدار رسوم الاشتراك لهذا الأسبوع سابقًا، ولن تُكرر');commit(`المشرف أصدر اشتراك الأسبوع ${key} على ${count} كباتن`)}
function disputeForm(oid){if(isAdmin())return notify('اختر حساب الكابتن لإرسال اعتراض باسمه');let eligible=orders().filter(o=>o.status==='confirmed'&&[o.owner,o.receiver].includes(s.viewer));if(!eligible.length)return notify('لا توجد طلبات مؤكدة في حسابك للاعتراض عليها');let options=eligible.map(o=>`<option value="${o.id}" ${oid===o.id?'selected':''}>#${o.id} — ${esc(o.description.slice(0,35))}</option>`).join('');modal('تقديم اعتراض',`<div class="fields"><div class="field wide"><label>الطلب</label><select id="disputeOrder">${options}</select></div><div class="field wide"><label>سبب الاعتراض</label><textarea id="disputeReason" placeholder="اشرح المشكلة بالتفصيل ..."></textarea></div></div>`,'إرسال الاعتراض',()=>{let id=Number($('disputeOrder').value),why=$('disputeReason').value.trim();if(why.length<6)return notify('اكتب سبب اعتراض واضحًا');if(disputes().some(d=>d.orderId===id&&d.uid===s.viewer&&d.status==='open'))return notify('هناك اعتراض مفتوح على هذا الطلب');let d={id:s.nextDispute++,orderId:id,uid:s.viewer,companyId:s.company,reason:why,status:'open',at:NOW()};s.disputes.push(d);closeModal();commit(`${name(s.viewer)} فتح اعتراض #${d.id} على الطلب #${id}`)})}
function resolve(id,accepted){if(!isAdmin())return notify('المشرف فقط');let d=disputes().find(x=>x.id===Number(id));if(!d||d.status!=='open')return notify('الاعتراض غير مفتوح');if(accepted){let charge=ledgers().find(x=>x.kind==='debit'&&x.category==='order'&&x.orderId===d.orderId&&x.userId===d.uid),rid=`dispute:credit:${d.orderId}:${d.uid}`;if(charge&&!s.ledger.some(x=>x.id===rid)&&!s.ledger.some(x=>x.id==='reversal:'+charge.id)){s.ledger.push({id:rid,companyId:s.company,userId:d.uid,kind:'credit',category:'dispute',orderId:d.orderId,amount:charge.amount,description:`رد عمولة اعتراض مقبول #${d.id} لطلب #${d.orderId}`,at:NOW()});d.resolution=`قُبل وردت عمولة ${jd(charge.amount)}`}else d.resolution='قُبل دون خصم جديد (العمولة رُدت سابقًا)';}else d.resolution='رُفض الاعتراض بعد المراجعة';d.status='resolved';d.reviewedAt=NOW();commit(`المشرف ${accepted?'قبل':'رفض'} الاعتراض #${d.id}: ${d.resolution}`)}
function saveSettings(){if(!isAdmin())return;let a=Number($('rateOwner').value),b=Number($('rateReceiver').value),fee=Math.round(Number($('weeklyFee').value)*1000),link=$('groupLink').value.trim();if(![a,b].every(x=>Number.isFinite(x)&&x>=0&&x<=100)||!Number.isSafeInteger(fee)||fee<0||fee>100000)return notify('تحقق من النسب وقيمة الاشتراك');if(link&&!/^https:\/\/chat\.whatsapp\.com\/[a-zA-Z0-9]+(?:\?.*)?$/.test(link))return notify('رابط المجموعة يجب أن يبدأ بـ https://chat.whatsapp.com/');Object.assign(company(),{ownerRate:a,receiverRate:b,weeklyFee:fee,groupLink:link});commit(`المشرف حدث نسب العمولة إلى ${a}% / ${b}% والاشتراك ${jd(fee)}`);notify('تم حفظ الإعدادات، والقيود السابقة لم تتغير')}
function openGroup(){let x=company().groupLink;if(!x)return notify('لم يُضف المشرف رابط مجموعة واتساب بعد');window.open(x,'_blank','noopener,noreferrer')}
function shareGroup(){let link=company().groupLink;if(!link)return notify('أدخل رابط مجموعة واتساب من الإعدادات أولًا');window.open('https://wa.me/?text='+encodeURIComponent('انضم إلى مجموعة '+company().name+'\n'+link),'_blank','noopener,noreferrer')}
function openSwitcher(){modal('اختيار الشركة والكابتن',`<div class="fields"><div class="field wide"><label>الشركة</label><select id="switchCompany">${s.companies.map(c=>`<option value="${c.id}" ${c.id===s.company?'selected':''}>${esc(c.name)}</option>`).join('')}</select></div><div class="field wide"><label>الحساب (بعد تغيير الشركة ستظهر حساباتها)</label><select id="switchUser">${activeUsers().map(u=>`<option value="${u.id}" ${s.viewer===u.id?'selected':''}>${esc(u.name)}</option>`).join('')}<option value="admin" ${isAdmin()?'selected':''}>المشرف</option></select></div></div>`,'انتقال',()=>{let c=$('switchCompany').value,uid=$('switchUser').value;closeModal();if(c!==s.company)return companySwitch(c);viewerSwitch(uid)})}
function openLogin(){modal('تسجيل كابتن / الاشتراك في شركة',`<p class="tiny muted">اختَر رمز الشركة الموجود لدى مشرفها، ثم أضف الكابتن للتجربة. هذه ليست مصادقة حقيقية أو اتصالًا بواتساب.</p><div class="fields"><div class="field wide"><label>كود الشركة</label><input id="joinCode" value="${esc(company().code)}" /></div><div class="field"><label>اسم الكابتن</label><input id="joinName" placeholder="مثال: سامر" /></div><div class="field"><label>رقم الهاتف</label><input id="joinPhone" inputmode="tel" placeholder="07xxxxxxxx" /></div></div>`,'تسجيل تجريبي',()=>{let code=$('joinCode').value.trim(),c=s.companies.find(x=>x.code.toLowerCase()===code.toLowerCase()),n=$('joinName').value.trim(),ph=$('joinPhone').value.replace(/\s+/g,'');if(!c)return notify('كود الشركة غير صحيح');if(n.length<2||!/^(07\d{8}|\+9627\d{8})$/.test(ph))return notify('أدخل اسمًا ورقمًا أردنيًا صحيحًا');if(s.users.some(x=>x.phone===ph&&x.companyId===c.id))return notify('الهاتف مسجل في الشركة بالفعل');let id='u'+(Date.now());s.users.push({id,name:n,phone:ph,companyId:c.id});s.company=c.id;s.viewer=id;s.page='chat';closeModal();commit(`تسجيل كابتن جديد: ${n} — كود الشركة ${c.code}`)})}
function addCompany(){if(!isAdmin())return;modal('إنشاء شركة تجريبية',`<div class="fields"><div class="field wide"><label>اسم الشركة</label><input id="companyName" placeholder="شركة التوصيل" /></div><div class="field wide"><label>كود الانضمام (إنجليزي/أرقام)</label><input id="companyCode" placeholder="JO-9000" /></div></div>`,'إضافة',()=>{let n=$('companyName').value.trim(),c=$('companyCode').value.trim();if(n.length<3||!/^[A-Z0-9-]{4,16}$/i.test(c))return notify('الاسم أو الكود غير صالح');if(s.companies.some(x=>x.code.toLowerCase()===c.toLowerCase()))return notify('الكود مستخدم من قبل');let id='c'+Date.now();s.companies.push({id,name:n,code:c,groupLink:'',ownerRate:5,receiverRate:5,weeklyFee:0});s.company=id;s.viewer='admin';s.page='settings';closeModal();commit(`المشرف أنشأ شركة جديدة ${n}`)})}
function openMenu(){modal('صفحات النظام',`<div class="data-list">${tabs.filter(x=>isAdmin()||!onlyAdmin.has(x[0])).map(([id,ic,label])=>`<button class="btn plain" style="justify-content:flex-start" onclick="ui.closeModal();ui.go('${id}')">${ic} ${label}</button>`).join('')}</div><div style="margin-top:16px" class="toolbar"><button class="btn outline" onclick="ui.closeModal();ui.openSwitcher()">تبديل كابتن / شركة</button><button class="btn outline" onclick="ui.closeModal();ui.openLogin()">تسجيل كابتن</button></div>`,'إغلاق',closeModal)}
function quick(txt){if(txt==='الطلبات')return go('orders');if(txt==='حسابي')return go('wallet');if(txt==='الجرد')return go('subscriptions');if(txt==='اعتراض')return go('disputes')}
function send(){let raw=$('messageInput')?.value.trim()||'';if(!raw)return;const normalized=raw.replace(/[٠-٩]/g,c=>'٠١٢٣٤٥٦٧٨٩'.indexOf(c)).replace(/[۰-۹]/g,c=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(c));let m;if(/^(طلبات|الطلبات)/.test(normalized))return go('orders');if(/^(حسابي|رصيدي|محفظتي)/.test(normalized))return go('wallet');if(/^الجرد/.test(normalized))return go('subscriptions');if(/^(اعتراض|شكوى)/.test(normalized))return go('disputes');if(m=normalized.match(/^(انا|أنا|استلام)\s*#?(\d+)/i)){claim(+m[2]);return}if(m=normalized.match(/^(تم|تاكيد|تأكيد)\s*#?(\d+)(?:\s+(\S+))?/i)){let o=order(+m[2]);if(!o)return notify('رقم الطلب غير موجود');if(o.claims.length===1)return confirm(o.id,o.claims[0]);if(o.claims.length===0)return notify('لا يوجد كابتن طلب استلام هذا الطلب');return notify('أكثر من مستلم ردّ على الطلب، استخدم زر التأكيد على رد الكابتن المقصود')}if(/^(طلب جديد|نشر)/.test(normalized))return postForm();notify('أوامر متاحة: الطلبات، حسابي، الجرد، أنا 502، تم 502. أو استخدم الأزرار داخل المحادثة.')}
function csvDownload(rows,filename){let csv='\ufeff'+rows.map(row=>row.map(v=>'"'+String(v??'').replace(/"/g,'""')+'"').join(',')).join('\r\n'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),2500)}
function exportCSV(kind){let r=[];if(kind==='orders')r=[['رقم','المالك','المستلم','الأجرة','الحالة'],...orders().map(o=>[o.id,name(o.owner),name(o.receiver),o.fare/1000,statusName(o.status)])];if(kind==='balances'||kind==='weekly')r=[['الكابتن','مدين','دائن','الرصيد'],...activeUsers().filter(u=>isAdmin()||u.id===s.viewer).map(u=>{let e=ledgers().filter(x=>x.userId===u.id&&(kind!=='weekly'||new Date(x.at)>=new Date(dueDate().getTime()-7*864e5)&&new Date(x.at)<dueDate()));return [u.name,e.filter(x=>x.kind==='debit').reduce((a,x)=>a+x.amount,0)/1000,e.filter(x=>x.kind==='credit').reduce((a,x)=>a+x.amount,0)/1000,(kind==='weekly'?e.reduce((a,x)=>a+(x.kind==='debit'?x.amount:-x.amount),0):balance(u.id))/1000]})];if(kind==='payments')r=[['رقم','الكابتن','القيمة','الحالة','المرجع'],...relevantPayments().map(p=>[p.id,name(p.uid),p.amount/1000,statusName(p.status),p.reference])];if(kind==='history')r=isAdmin()?[['التاريخ','الإجراء'],...s.events.filter(x=>x.companyId===s.company).map(e=>[arDate(e.at),e.text])]:[['التاريخ','الإجراء'],...ledgers().filter(x=>x.userId===s.viewer).map(e=>[arDate(e.at),e.description])];csvDownload(r,`wasla_${kind}_${new Date().toISOString().slice(0,10)}.csv`)}
function reset(){if(!isAdmin()||!window.confirm('إعادة جميع بيانات العرض التجريبية؟ سيتم حذف إدخالات هذه النسخة من المتصفح.'))return;s=seed();commit('إعادة بيانات العرض')}
window.ui={go,companySwitch,viewerSwitch,openSwitcher,openLogin,openMenu,addCompany,openGroup,shareGroup,postForm,claim,confirm,cancel,setFare,setPeriod,payForm,approvePayment,rejectPayment,proof,receipt,issueSubscription,disputeForm,resolve,saveSettings,quick,send,closeModal,exportCSV,reset,focusWallet:(uid)=>{s.viewer=uid;s.page='wallet';persist();render();notify('انتقلت إلى محفظة '+name(uid))}};
$('companySelect').addEventListener('change',e=>companySwitch(e.target.value));$('userSelect').addEventListener('change',e=>viewerSwitch(e.target.value));
window.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});render();
// Exposed only for isolated prototype tests, not an authentication / production API.
window.__waslaDemoTest={state:()=>s,confirm,claim,cancel,approvePayment,issueSubscription,resolve,balance,resetWithoutPrompt:()=>{s=seed();persist();render()}};
})();
</script>
